name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1-5"   # weekday mornings: notice Yahoo/SEC format changes even without new commits

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m pyflakes backend tests
      - name: Check JavaScript syntax
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: Unit, API and network-layer tests (offline) with coverage
        run: python -m pytest -q --ignore=tests/e2e --cov=backend --cov-report=term-missing --cov-fail-under=80

  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: End-to-end tests (Terminal, Overview, Settings)
        run: python -m pytest -v tests/e2e

  windows-launcher:
    name: Windows start.bat from scratch
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create a foreign virtualenv (like another tool's Python on Eric's PC)
        shell: cmd
        run: |
          python -m venv C:\othervenv
          C:\othervenv\Scripts\python.exe -m pip install --quiet uvicorn
      - name: start.bat check - with the foreign venv active
        shell: cmd
        env:
          FLOWER_DEMO: "1"
        run: |
          set "PATH=C:\othervenv\Scripts;%PATH%"
          set "VIRTUAL_ENV=C:\othervenv"
          call start.bat check --report launcher-report.txt
          if errorlevel 1 exit /b 1
          if not exist .venv\Scripts\python.exe exit /b 1
      - name: start.bat check - second run reuses .venv
        shell: cmd
        env:
          FLOWER_DEMO: "1"
        run: call start.bat check
      - name: Start the real server and request every page
        shell: pwsh
        env:
          FLOWER_DEMO: "1"
          PORT: "8765"
        run: |
          $p = Start-Process -FilePath ".venv\Scripts\python.exe" -ArgumentList "-m","backend" -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/status | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Get-Content server.log, server.err; Stop-Process $p.Id; exit 1 }
          foreach ($u in "/terminal","/overview","/settings","/api/market","/api/overview","/api/quote/AAPL","/api/history/SAP.DE?period=1y") {
            $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765$u"
            Write-Host "$($r.StatusCode) $u"
            if ($r.StatusCode -ne 200) { Stop-Process $p.Id; exit 1 }
          }
          Stop-Process $p.Id
      - name: Upload launcher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-report
          path: launcher-report.txt
          if-no-files-found: ignore

  live-data:
    name: Live data (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Yahoo sometimes rate-limits GitHub's shared runners; this job reports problems but never blocks the others.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # The SEC rejects no-reply contact addresses (verified in CI run #3); set the repository
      # variable SEC_CONTACT to your own address to identify yourself properly.
      SEC_CONTACT: ${{ vars.SEC_CONTACT || 'flower-terminal@example.com' }}
      FLOWER_DB: ${{ github.workspace }}/live-check.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Health check against real Yahoo Finance and SEC EDGAR (one retry)
        run: |
          report="check-report-${{ matrix.os }}.txt"
          python -m backend.check --live --report "$report" || { echo "Retrying in 60s..."; sleep 60; python -m backend.check --live --report "$report"; }
      - name: Add report to the run summary
        if: always()
        run: |
          echo '### Live data check (${{ matrix.os }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat check-report-*.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report-${{ matrix.os }}
          path: check-report-*.txt
          if-no-files-found: ignore
